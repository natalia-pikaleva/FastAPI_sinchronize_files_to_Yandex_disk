name: CI Pipeline

on: [push]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          pip install black
      - run: black main.py

  tests:
    runs-on: ubuntu-latest
    needs: format
    services:
      docker:
        image: docker:20.10.16-dind
        options: --privileged
    steps:
      - uses: actions/checkout@v3

      - name: Create .env file
        run: |
          echo "TOKEN=${{ secrets.TOKEN }}" >> .env
          echo "DEV_DIRECTORY_PATH=${{ secrets.DEV_DIRECTORY_PATH }}" >> .env
          echo "DIRECTORY_PATH=${{ secrets.DIRECTORY_PATH }}" >> .env
          echo "CLOUD_DIRECTORY=${{ secrets.CLOUD_DIRECTORY }}" >> .env

      - name: Start Docker Compose
        run: docker compose up -d
        
      - name: Wait for app to be ready
        run: |
          # Пример простой проверки доступности приложения
          for i in {1..10}; do
            if curl -s http://localhost:8000/sync; then
              echo "App is up"
              break
            fi
            echo "Waiting for app..."
            sleep 3
          done

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          pytest tests/

      - name: Shutdown Docker Compose
        run: docker compose down
